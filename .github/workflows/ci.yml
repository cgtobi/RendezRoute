name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Format, lint and type-check
        run: npx vp check --deny-warnings
      - name: Type-check with tsc
        run: npm run typecheck
      # Before the tests: they check the bundled assets for external references (spec 2b).
      - name: Build
        run: npm run build
      - name: Test
        run: npx vp test
      - name: Audit dependencies
        run: npm audit --audit-level=high

  # The release image builds for both architectures (spec 2 packaging). Nothing is pushed.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
      # The Home Assistant app image (decisions D57, I77) is built the way the publish workflow
      # does it, with the IMAGE_TARGET build argument (the builder actions have no `target` input),
      # for one architecture so it can be loaded and inspected. The layers come from the build above.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: IMAGE_TARGET=ha
          platforms: linux/amd64
          load: true
          tags: rendezroute-ha-arg:ci
      # `--target ha` has to keep working as well (the same layers again, so it is cheap).
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ha
          platforms: linux/amd64
          load: true
          tags: rendezroute-ha-target:ci
      - name: Check the Home Assistant images
        run: |
          for image in rendezroute-ha-arg:ci rendezroute-ha-target:ci; do
            test "$(docker image inspect "$image" --format '{{json .Config.Entrypoint}}')" = '["node","dist/ha-start.js"]'
            test "$(docker image inspect "$image" --format '{{.Config.User}}')" = root
            test "$(docker image inspect "$image" --format '{{index .Config.Labels "io.hass.type"}}')" = app
          done

  # The Home Assistant app's config.yaml against the community linter (a Docker action, so it
  # needs no Python here). The Supervisor's schemas run in home-assistant-schema below. The
  # schema/option/translation agreement and the repository.yaml and version checks are vitest tests
  # (test/ha-app), which the check job runs.
  home-assistant-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: frenck/action-addon-linter@d51677290aef26cdfc835271dd3c7343ce502809 # v2.21
        with:
          path: ./homeassistant/rendezroute

  # The Home Assistant app's AppArmor profile must parse (the Supervisor and the OS Agent refuse an
  # app whose profile does not) and define exactly one profile, named like the slug the Supervisor
  # rewrites it to. -Q and -K: syntax only, no kernel load and no cache. The rules themselves are
  # checked on real devices (decision D60).
  home-assistant-apparmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the AppArmor parser
        run: sudo apt-get update && sudo apt-get install -y apparmor
      - name: Parse the profile
        run: apparmor_parser -Q -K homeassistant/rendezroute/apparmor.txt
      - name: Check the profile name
        run: |
          names="$(apparmor_parser --names -Q -K homeassistant/rendezroute/apparmor.txt 2>/dev/null)"
          echo "profile names: $names"
          test "$names" = rendezroute
      # The parser of Home Assistant OS (buildroot ships AppArmor 3.1.7, as Alpine 3.20 does), in a
      # container so that the Ubuntu runner's newer parser is not the only check.
      - name: Parse the profile with the parser of Home Assistant OS
        run: |
          docker run --rm -v "$PWD/homeassistant/rendezroute:/p:ro" \
            alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc sh -c '
              apk add --no-cache apparmor apparmor-profiles >/dev/null &&
              apparmor_parser -Q -K /p/apparmor.txt &&
              test "$(apparmor_parser --names -Q -K --skip-cache /p/apparmor.txt 2>/dev/null)" = rendezroute'

  # The Home Assistant app's files against the Supervisor's own schemas (the code that validates
  # config.yaml, the translations and repository.yaml on a user's installation), by the script
  # scripts/validate-ha-app.py. The Supervisor is checked out at a pinned commit (98a2322, the
  # 2026-11-12 state of its main branch; its pyproject.toml requires Python 3.14). Raise the pin
  # deliberately, together with whatever the new schema asks of the app.
  # Supply chain: the pip packages are those of that commit's requirements.txt, pinned by version
  # but not by hash (that is how the Supervisor ships them), and they run here only with the
  # read-only token, no secrets, and nothing of this job is published.
  home-assistant-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: home-assistant/supervisor
          ref: 98a2322374ae3d0c248079d11f7435ad759935fa
          path: supervisor
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install the Supervisor's requirements
        run: python -m pip install --no-cache-dir -r supervisor/requirements.txt
      - name: Validate the app files
        env:
          PYTHONPATH: supervisor
        run: python scripts/validate-ha-app.py .

  # The core loop in a browser against the built image on empty volumes, with default settings
  # (fake providers) and with maps, geocoder and weather disabled (spec 2b definition of done).
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
