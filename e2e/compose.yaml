# End-to-end environment (spec 2b definition of done): the built image on empty volumes, hardened
# like production, in several variants: default settings pointed at fake providers; maps, geocoder
# and weather disabled; the 0.7 to 0.9 features (admin, invite-only posting, OIDC and fediverse
# login, email, against fakes); the admin listener on its own port and behind Ingress; and two
# copies with a movable clock for the specs that wait for a plan to start. Started and stopped by
# global-setup.ts.
name: rendezroute-e2e

x-app: &app
  image: rendezroute:e2e
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  depends_on:
    fakes:
      condition: service_healthy

x-env: &env # Plain http for localhost and the fake services; production requires HTTPS.
  ALLOW_INSECURE_DEV: "true"
  CONTACT_EMAIL: e2e@example.org
  MAP_TILE_URL: http://fakes:8080/tiles/{z}/{x}/{y}.png
  MAP_ATTRIBUTION: Test tiles
  GEOCODER_URL: http://fakes:8080
  WEATHER_URL: http://fakes:8080

services:
  fakes:
    # A fixed address: the app of the Ingress variant trusts only this one as its Supervisor
    # (ADMIN_INGRESS_PEER below), as the real app trusts 172.30.32.2.
    networks:
      default:
        ipv4_address: 10.213.77.10
    image: node:26-trixie-slim@sha256:e6bedef217677b276c591795e169840edd9096dbf13f29df8ef8d1856b8820bc
    command: ["node", "/fakes/server.ts"]
    volumes:
      - ./fakes:/fakes:ro
    ports:
      - "8080:8080"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 2s
      retries: 15

  app-default:
    <<: *app
    build: ..
    environment:
      <<: *env
      BASE_URL: http://localhost:3101
    volumes:
      - default-data:/data
    ports:
      - "3101:3000"

  app-minimal:
    <<: *app
    environment:
      <<: *env
      BASE_URL: http://localhost:3102
      MAPS_ENABLED: "false"
      GEOCODER_ENABLED: "false"
      WEATHER_ENABLED: "false"
    volumes:
      - minimal-data:/data
    ports:
      - "3102:3000"

  # The 0.7 to 0.9 features: instance admin, invite-only posting, OIDC and fediverse login,
  # email (fakes).
  app-accounts:
    <<: *app
    environment:
      <<: *env
      BASE_URL: http://localhost:3103
      # Each test person sends an address of their own (helpers.ts), as people behind a proxy do,
      # so the per-client limits (admin login, plan creation) see separate people, not one
      # machine running every journey. The other two containers keep the default (no proxy).
      TRUST_PROXY: "true"
      ADMIN_TOKEN: e2e-admin-token-0123456789abcdefghij
      POSTING_MODE: invite
      OIDC_ISSUER: http://fakes:8080/oidc
      OIDC_CLIENT_ID: rendezroute-e2e
      OIDC_CLIENT_SECRET: e2e-oidc-secret
      OIDC_NAME: E2E login
      FEDIVERSE_LOGIN: "true"
      FEDIVERSE_LOGIN_SERVERS: fakes:8080
      SMTP_HOST: fakes
      SMTP_PORT: "2525"
      SMTP_TLS: none
      SMTP_FROM: runs@example.org
      NTFY_URL: http://fakes:8080/ntfy
      TELEGRAM_BOT_TOKEN: "123456789:AAH-e2e-fake-bot-token-0123456789ab"
      TELEGRAM_API_URL: http://fakes:8080/telegram
    volumes:
      - accounts-data:/data
    ports:
      - "3103:3000"

  # The admin pages on a second listener (0.10, decision D55): public port 3104, admin port 3105
  # (3001 inside the container, bound to all addresses so Docker can publish it). No SMTP here:
  # the report alert email is covered by unit tests.
  app-admin-split:
    <<: *app
    environment:
      <<: *env
      BASE_URL: http://localhost:3104
      TRUST_PROXY: "true"
      ADMIN_TOKEN: e2e-admin-token-0123456789abcdefghij
      ADMIN_PORT: "3001"
      ADMIN_BIND: 0.0.0.0
      ADMIN_URL: http://localhost:3105
      POSTING_MODE: invite
    volumes:
      - admin-split-data:/data
    ports:
      - "3104:3000"
      - "3105:3001"

  # The admin listener behind Home Assistant Ingress (0.10 step 10b, decision D56). The fake
  # Supervisor in the fakes container (supervisor.ts) proxies http://fakes:8080/ingress/e2e/ to the
  # admin listener and answers the version check; the browser never reaches the listener on its
  # own (3107 is published only to show that a direct request is refused). No ADMIN_TOKEN.
  app-admin-ingress:
    <<: *app
    environment:
      <<: *env
      BASE_URL: http://localhost:3106
      TRUST_PROXY: "true"
      ADMIN_INGRESS: "true"
      ADMIN_PORT: "3001"
      ADMIN_BIND: 0.0.0.0
      ADMIN_INGRESS_PEER: 10.213.77.10
      SUPERVISOR_URL: http://fakes:8080
      SUPERVISOR_TOKEN: e2e-supervisor-token
      POSTING_MODE: invite
    volumes:
      - admin-ingress-data:/data
    ports:
      - "3106:3000"
      - "3107:3001"

  # The two specs that wait for a plan to start move the server clock instead (D87, plan I102):
  # the clock is one per process, so they get containers of their own, with the same settings as
  # app-default and app-accounts plus E2E_CLOCK_CONTROL, and no other spec uses them.
  app-clock-default:
    <<: *app
    environment:
      <<: *env
      BASE_URL: http://localhost:3108
      E2E_CLOCK_CONTROL: "true"
    volumes:
      - clock-default-data:/data
    ports:
      - "3108:3000"

  # The fakes are shared with app-accounts, so this one has its own contact address (the report
  # alert mail of v09-recap's Flag must not reach the mailbox v08 reads) and no ntfy or Telegram
  # (a second bot poller would take the updates v08 waits for); v09-recap uses neither.
  app-clock-accounts:
    <<: *app
    environment:
      <<: *env
      CONTACT_EMAIL: e2e-clock@example.org
      BASE_URL: http://localhost:3109
      E2E_CLOCK_CONTROL: "true"
      TRUST_PROXY: "true"
      ADMIN_TOKEN: e2e-admin-token-0123456789abcdefghij
      POSTING_MODE: invite
      OIDC_ISSUER: http://fakes:8080/oidc
      OIDC_CLIENT_ID: rendezroute-e2e
      OIDC_CLIENT_SECRET: e2e-oidc-secret
      OIDC_NAME: E2E login
      FEDIVERSE_LOGIN: "true"
      FEDIVERSE_LOGIN_SERVERS: fakes:8080
      SMTP_HOST: fakes
      SMTP_PORT: "2525"
      SMTP_TLS: none
      SMTP_FROM: runs@example.org
    volumes:
      - clock-accounts-data:/data
    ports:
      - "3109:3000"

networks:
  default:
    ipam:
      config:
        - subnet: 10.213.77.0/24
          # Dynamic addresses stay out of the fakes fixed .10.
          ip_range: 10.213.77.128/25

volumes:
  default-data:
  minimal-data:
  accounts-data:
  admin-split-data:
  admin-ingress-data:
  clock-default-data:
  clock-accounts-data:
